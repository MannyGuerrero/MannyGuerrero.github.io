name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview deploy: run the guard in warning mode (site stays noindex). Default false."
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these as repository variables (Settings, Secrets and variables, Variables)
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_INDEXABLE: ${{ vars.NEXT_PUBLIC_INDEXABLE }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      # CI guard fails on any unconfirmed c() copy, dash, arrow, emoji or employer leak.
      # The client name blocklist is local only, so run `npm run release` on your machine before pushing.
      - name: Guard (strict)
        if: ${{ inputs.preview != true }}
        run: npm run guard:ci
      - name: Guard (preview, warnings only)
        if: ${{ inputs.preview == true }}
        run: npm run guard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
